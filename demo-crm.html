<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Demonstração</title>
<style>
:root {
  --bg:#F5F5F7; --bg2:#FFFFFF; --bg3:#F0F0F3; --border:#DDDDE3;
  --text:#1A1A2E; --muted:#6B6B80; --accent:#3B5BDB;
  --green:#2F9E44; --green-bg:#EBFBEE; --red:#C92A2A; --red-bg:#FFF5F5;
  --yellow:#E67700; --yellow-bg:#FFF9DB; --blue-bg:#E7F5FF;
  --radius:10px; --rsm:6px;
  --shadow:0 1px 4px rgba(0,0,0,.08); --shadow-md:0 4px 16px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* DEMO BANNER */
.demo-banner{background:linear-gradient(135deg,#3B5BDB,#7048E8);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:999;box-shadow:0 2px 10px rgba(59,91,219,.4)}
.demo-banner .left{display:flex;align-items:center;gap:10px}
.demo-badge{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;border:1px solid rgba(255,255,255,.3)}
.demo-banner p{font-size:13px;opacity:.95}
.demo-banner a{color:#fff;font-weight:700;text-decoration:underline}

.app{display:flex;height:calc(100vh - 44px);overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sb-logo{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sb-logo .brand{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.sb-logo h2{font-size:14px;font-weight:700;color:var(--accent);margin-top:3px}
.nav{padding:8px 7px;flex:1;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rsm);font-size:13px;cursor:pointer;color:var(--muted);border:none;background:none;text-align:left;width:100%;transition:all .15s}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:var(--blue-bg);color:var(--accent);font-weight:600}
.ni .ico{font-size:14px;width:20px;text-align:center}
.sb-footer{padding:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:15px;font-weight:700}
.spacer{flex:1}
.content{flex:1;overflow-y:auto;padding:20px}

/* DISABLED OVERLAY for buttons */
.btn-demo{padding:7px 15px;border-radius:var(--rsm);border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-size:12px;font-weight:600;cursor:not-allowed;opacity:.6}
.btn-demo-accent{background:#C5CEFD;color:#3B5BDB;border:none;border-radius:var(--rsm);padding:7px 15px;font-size:12px;font-weight:600;cursor:not-allowed}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:700}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search-demo{flex:1;min-width:160px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 12px;color:var(--muted);font-size:13px;cursor:not-allowed}
.flt-demo{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 12px;color:var(--muted);font-size:13px;cursor:not-allowed}
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
thead th{padding:10px 13px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap}
tbody tr{border-top:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:var(--bg3)}
tbody td{padding:10px 13px;font-size:13px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-lead{background:var(--yellow-bg);color:var(--yellow)}
.b-proposta{background:var(--blue-bg);color:#1971C2}
.b-contrato{background:#EDF2FF;color:var(--accent)}
.b-ativo{background:var(--green-bg);color:var(--green)}
.b-encerrado{background:var(--red-bg);color:var(--red)}
.pay-ok{color:var(--green);font-weight:600}
.pay-pend{color:var(--yellow)}
.pay-late{color:var(--red);font-weight:600}
.notes-box{background:var(--bg3);border-radius:var(--rsm);padding:11px;font-size:12px;line-height:1.65;min-height:50px}

/* PANEL */
.panel{display:none;position:fixed;right:0;top:44px;bottom:0;width:400px;background:var(--bg2);border-left:1px solid var(--border);z-index:200;overflow-y:auto;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
.panel.open{display:flex}
.ph{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
.ph h3{font-size:17px;font-weight:700}
.close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.pb{padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.ps{display:flex;flex-direction:column;gap:6px}
.ps h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--border)}
.dr{display:flex;justify-content:space-between;font-size:13px}
.dr span:first-child{color:var(--muted)}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;padding:3px 5px 6px}
.ptable td{padding:6px 5px;border-top:1px solid var(--border)}
.pf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px}

/* CONTRACT PREVIEW */
.contract-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:48px;font-family:Georgia,serif;font-size:13px;line-height:1.9;max-width:780px;margin:0 auto;box-shadow:var(--shadow-md)}
.contract-wrap h2{text-align:center;font-size:17px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.contract-wrap .sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:36px}
.contract-wrap p{margin-bottom:12px;text-align:justify}
.contract-wrap .clause{font-weight:700;margin-top:20px;margin-bottom:4px}
.contract-wrap .sig{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.contract-wrap .sig-line{border-top:1px solid #333;padding-top:6px;font-size:12px;text-align:center}

/* DASHBOARD */
.dash-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.dash-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.dash-box h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px}
.dash-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}

/* PROGRESS BAR */
.prog-bar{height:6px;background:var(--bg3);border-radius:3px;margin-top:6px}
.prog-fill{height:100%;border-radius:3px;background:var(--accent)}

@media(max-width:700px){.sidebar{display:none}.panel{width:100%;top:44px}}
</style>
</head>
<body>

<!-- DEMO BANNER -->
<div class="demo-banner">
  <div class="left">
    <span class="demo-badge">🔍 DEMONSTRAÇÃO</span>
    <p>Está a visualizar uma prévia do sistema. Os dados são fictícios e nenhuma ação é real.</p>
  </div>

  <div class="content" id="content"></div>

<!-- PANEL DETAIL -->
<div class="panel" id="panel">

    parcelas:[
      {data:'2025-02-10',valor:800,desc:'Entrada',status:'pago'},
      {data:'2025-05-10',valor:800,desc:'2ª Parcela',status:'cancelado'},
    ]
  },
];

const sLabel={lead:'Lead',proposta:'Proposta Enviada',contrato:'Contrato Assinado',ativo:'Ativo',confirmada:'Confirmada',encerrado:'Encerrado'};
const sCls={lead:'b-lead',proposta:'b-proposta',contrato:'b-contrato',ativo:'b-ativo',confirmada:'b-ativo',encerrado:'b-encerrado'};
const fLabel={transferencia:'Transferência Bancária',mbway:'MBWay',cartao:'Cartão de Crédito',cheque:'Cheque',dinheiro:'Dinheiro'};

function fmt(v){return'€ '+parseFloat(v||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtD(d){if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('pt-PT')}

function getFin(c){
  const total=parseFloat(c.valorTotal||0);
  const rec=(c.parcelas||[]).filter(p=>p.status==='pago').reduce((s,p)=>s+parseFloat(p.valor||0),0);
  return{total,rec,emFalta:total-rec};
}

function demoAlert(){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1A1A2E;color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3)';
  el.textContent='⚠️ Funcionalidade disponível na versão completa';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

let currentSection='clientes';
function showSection(s){
  currentSection=s;
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.ni')[{clientes:0,pagamentos:1,contratos:2,dashboard:3}[s]].classList.add('active');
  const titles={clientes:'Clientes',pagamentos:'Pagamentos',contratos:'Contrato — Exemplo',dashboard:'Dashboard'};
  document.getElementById('viewTitle').textContent=titles[s];
  document.getElementById('content').style.opacity='0';
  setTimeout(()=>{
    if(s==='clientes') renderClientes();
    else if(s==='pagamentos') renderPagamentos();
    else if(s==='contratos') renderContrato();
    else renderDashboard();
    document.getElementById('content').style.transition='opacity .25s';
    document.getElementById('content').style.opacity='1';
  },120);
  closePanel();
}

// ══ CLIENTES ══
function renderClientes(){
  document.getElementById('content').innerHTML=`
    <div class="toolbar">
      <input class="search-demo" placeholder="Buscar cliente... (somente leitura)" disabled>
      <select class="flt-demo" disabled><option>Todos os Status</option></select>
      <select class="flt-demo" disabled><option>Todos os Produtos</option></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nome</th><th>Produto</th><th>Status</th><th>Valor Total</th><th>Recebido</th><th>Em Falta</th><th>Ações</th></tr></thead>
        <tbody>
          ${CLIENTES.map(c=>{
            const{total,rec,emFalta}=getFin(c);
            return`<tr onclick="openPanel('${c.id}')" style="cursor:pointer">
              <td><b>${c.nome}</b>${c.empresa?`<br><small style="color:var(--muted)">${c.empresa}</small>`:''}</td>
              <td>${c.produto||'—'}</td>
              <td><span class="badge ${sCls[c.status]}">${sLabel[c.status]}</span></td>
              <td>${total?fmt(total):'—'}</td>
              <td class="pay-ok">${fmt(rec)}</td>
              <td class="${emFalta>0?'pay-pend':'pay-ok'}">${fmt(emFalta)}</td>
              <td><button class="btn-demo btn-demo" onclick="event.stopPropagation();demoAlert()">✏</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

// ══ PAGAMENTOS ══
function renderPagamentos(){
  const today=new Date().toISOString().slice(0,10);
  const all=[];
  CLIENTES.forEach(c=>(c.parcelas||[]).forEach((p,i)=>all.push({...p,cliente:c.nome,cid:c.id,idx:i})));
  all.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const pagas=all.filter(r=>r.status==='pago');
  const pend=all.filter(r=>r.status==='pendente');
  const atras=all.filter(r=>r.status!=='pago'&&r.status!=='cancelado'&&r.data&&r.data<today);
  document.getElementById('content').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="lbl">Total Parcelas</div><div class="val">${all.length}</div></div>
      <div class="kpi"><div class="lbl">✅ Pagas</div><div class="val" style="color:var(--green)">${pagas.length}</div><div class="sub">${fmt(pagas.reduce((s,r)=>s+r.valor,0))}</div></div>
      <div class="kpi"><div class="lbl">⏳ Pendentes</div><div class="val" style="color:var(--yellow)">${pend.length}</div><div class="sub">${fmt(pend.reduce((s,r)=>s+r.valor,0))}</div></div>
      <div class="kpi"><div class="lbl">🔴 Atrasadas</div><div class="val" style="color:var(--red)">${atras.length}</div><div class="sub">${fmt(atras.reduce((s,r)=>s+r.valor,0))}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Cliente</th><th>Descrição</th><th>Data</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead>
        <tbody>${all.map((r,i)=>{
          const late=r.status!=='pago'&&r.status!=='cancelado'&&r.data&&r.data<today;
          const eff=late?'atrasado':r.status;
          const cls={pago:'pay-ok',pendente:'pay-pend',atrasado:'pay-late',cancelado:''}[eff]||'';
          const stxt={pago:'✅ Pago',pendente:'⏳ Pendente',atrasado:'🔴 Atrasado',cancelado:'Cancelado'}[eff]||eff;
          return`<tr>
            <td>${i+1}</td>
            <td><b style="color:var(--accent);cursor:pointer" onclick="openPanel('${r.cid}')">${r.cliente}</b></td>
            <td>${r.desc||'—'}</td>
            <td>${fmtD(r.data)}</td>
            <td><b>${fmt(r.valor)}</b></td>
            <td><span class="${cls}">${stxt}</span></td>
            <td>${r.status!=='pago'?`<button class="btn-demo" onclick="demoAlert()">Marcar Pago</button>`:'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
}

// ══ CONTRATO EXEMPLO ══
function renderContrato(){
  document.getElementById('content').innerHTML=`
    <div style="max-width:780px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <select class="flt-demo" disabled><option>Dubai 2026 — Ana Sofia Ferreira</option></select>
        <button class="btn-demo" onclick="demoAlert()">🖨️ Imprimir / PDF</button>

// ══ DASHBOARD ══
function renderDashboard(){
  const total=CLIENTES.length;
  let tVal=0,tRec=0;
  const bySt={};
  const byProd={};
  CLIENTES.forEach(c=>{
    bySt[c.status]=(bySt[c.status]||0)+1;
    byProd[c.produto]=(byProd[c.produto]||0)+1;
    const{total:t,rec}=getFin(c);
    tVal+=t; tRec+=rec;
  });

  document.getElementById('content').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="lbl">Total Clientes</div><div class="val" style="color:var(--accent)">${total}</div></div>
      <div class="kpi"><div class="lbl">Valor Total</div><div class="val" style="font-size:18px">${fmt(tVal)}</div></div>
      <div class="kpi"><div class="lbl">Total Recebido</div><div class="val" style="color:var(--green);font-size:18px">${fmt(tRec)}</div><div class="sub">${Math.round(tRec/tVal*100)}% do total</div></div>
      <div class="kpi"><div class="lbl">Por Receber</div><div class="val" style="color:var(--yellow);font-size:18px">${fmt(tVal-tRec)}</div></div>
    </div>
    <div class="dash-grid2">
      <div class="dash-box">
        <h4>Clientes por Status</h4>
        ${Object.entries(sLabel).filter(([k])=>bySt[k]).map(([k,v])=>`
          <div class="dash-row">
            <span class="badge ${sCls[k]}">${v}</span>
            <b>${bySt[k]||0}</b>
          </div>`).join('')}
      </div>
      <div class="dash-box">
        <h4>Por Programa</h4>
        ${Object.entries(byProd).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <div class="dash-row"><span>${k}</span><b>${v}</b></div>
          <div class="prog-bar"><div class="prog-fill" style="width:${Math.round(v/total*100)}%"></div></div>`).join('')}
      </div>
    </div>
    <div class="dash-box" style="margin-top:2px">
      <h4>Clientes Recentes</h4>
      ${CLIENTES.slice(0,5).map(c=>{
        const{total:t,rec}=getFin(c);
        return`<div class="dash-row">
          <div><b>${c.nome}</b> <span style="color:var(--muted);font-size:12px">· ${c.produto}</span></div>
          <div style="text-align:right">
            <span class="badge ${sCls[c.status]}">${sLabel[c.status]}</span>
            <br><small class="pay-ok">${fmt(rec)} / ${fmt(t)}</small>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// ══ PANEL ══
function openPanel(id){
  const c=CLIENTES.find(x=>x.id===id); if(!c) return;
  const today=new Date().toISOString().slice(0,10);
  const{total,rec,emFalta}=getFin(c);
  document.getElementById('pNome').textContent=c.nome;
  document.getElementById('pBadge').innerHTML=`<span class="badge ${sCls[c.status]}">${sLabel[c.status]}</span>`;
  document.getElementById('panelBody').innerHTML=`
    <div class="ps">
      <h4>Contacto</h4>
      <div class="dr"><span>Email</span><span>${c.email||'—'}</span></div>
      <div class="dr"><span>Telefone</span><span>${c.tel||'—'}</span></div>
      <div class="dr"><span>NIF</span><span>${c.nif||'—'}</span></div>
      <div class="dr"><span>Morada</span><span>${c.morada||'—'}</span></div>
      <div class="dr"><span>Cidade/País</span><span>${[c.cidade,c.pais].filter(Boolean).join(', ')||'—'}</span></div>
    </div>
    <div class="ps">
      <h4>Negócio</h4>
      <div class="dr"><span>Produto</span><b>${c.produto||'—'}</b></div>
      <div class="dr"><span>Origem</span><span>${c.origem||'—'}</span></div>
      <div class="dr"><span>Responsável</span><span>${c.responsavel||'—'}</span></div>
    </div>
    <div class="ps">
      <h4>Financeiro</h4>
      <div class="dr"><span>Valor Total</span><b>${fmt(total)}</b></div>
      <div class="dr"><span>Recebido</span><span class="pay-ok">${fmt(rec)}</span></div>
      <div class="dr"><span>Em Falta</span><span class="pay-pend">${fmt(emFalta)}</span></div>
      <div class="prog-bar" style="margin-top:8px"><div class="prog-fill" style="width:${total?Math.round(rec/total*100):0}%"></div></div>
    </div>
    <div class="ps">
      <h4>Parcelas</h4>
      <table class="ptable">
        <thead><tr><th>#</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody>${(c.parcelas||[]).map((p,i)=>{
          const late=p.status!=='pago'&&p.status!=='cancelado'&&p.data&&p.data<today;
          const cls=p.status==='pago'?'pay-ok':late?'pay-late':'pay-pend';
          const stxt=p.status==='pago'?'✅ Pago':late?'🔴 Atrasado':p.status==='cancelado'?'Cancelado':'⏳ Pendente';
          return`<tr><td>${i+1}</td><td>${fmtD(p.data)}</td><td><b>${fmt(p.valor)}</b></td><td class="${cls}">${stxt}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    <div class="ps">
      <h4>Notas</h4>
      <div class="notes-box">${c.notas||'(sem notas)'}</div>
    </div>`;
  document.getElementById('panel').classList.add('open');
}

function closePanel(){document.getElementById('panel').classList.remove('open')}

// INIT
renderClientes();
</script>
