<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamentos — Infraimpério</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f1f5f9; color:#1e293b; font-size:14px; }
  #orc-wrapper { max-width:900px; margin:0 auto; padding:16px; }

  /* ── Shared utility styles from suite ── */
  .orc-label { display:block; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#64748b; margin-bottom:4px; }
  .orc-input { width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:8px 10px; font-size:0.9rem; font-family:inherit; color:#1e293b; background:#fff; outline:none; transition:border-color .15s; }
  .orc-input:focus { border-color:#7c3aed; }
  .orc-btn { border:none; border-radius:8px; padding:9px 18px; font-size:0.85rem; font-weight:700; cursor:pointer; font-family:inherit; transition:opacity .15s; }
  .orc-btn:hover { opacity:.88; }
  .orc-btn-primary { background:#7c3aed; color:#fff; }
  .orc-btn-save { background:#0ea5e9; color:#fff; }
  .orc-btn-cancel { background:#f1f5f9; color:#475569; border:1.5px solid #e2e8f0; }

/* ── Orçamentos ──────────────────────────────────── */
.orc-label { display:block;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px }
.orc-input { width:100%;padding:8px 10px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:0.84rem;font-family:inherit;color:#1a1a2e;background:#fff;box-sizing:border-box }
.orc-input:focus { outline:none;border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,0.12) }
.orc-stat-card { background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px }
.orc-filter { background:#f3f4f6;color:#374151;border:1.5px solid #e5e7eb;border-radius:20px;padding:5px 14px;font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s }
.orc-filter:hover { border-color:#0ea5e9;color:#0ea5e9 }
.orc-filter-active { background:#0ea5e9 !important;color:#fff !important;border-color:#0ea5e9 !important }
.orc-card { background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all 0.15s }
.orc-card:hover { border-color:#0ea5e9;box-shadow:0 4px 16px rgba(14,165,233,0.1);transform:translateY(-1px) }
.orc-status-btn { border:2px solid #e5e7eb;border-radius:8px;padding:7px 14px;font-size:0.8rem;font-weight:700;cursor:pointer;font-family:inherit;background:#f9fafb;color:#374151;transition:all 0.15s }
.orc-status-pendente.orc-status-active { background:#fef9c3;color:#92400e;border-color:#fde68a }
.orc-status-aprovado.orc-status-active { background:#dcfce7;color:#166534;border-color:#86efac }
.orc-status-rejeitado.orc-status-active { background:#fee2e2;color:#991b1b;border-color:#fca5a5 }
.orc-svc-block { background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px }
.orc-svc-block:hover { border-color:#cbd5e1 }
.orc-item-row { display:flex;align-items:center;gap:6px;margin-bottom:5px }
.orc-item-inp { flex:1;border:1.5px solid #e5e7eb;border-radius:6px;padding:5px 8px;font-size:0.82rem;font-family:inherit;color:#1a1a2e;background:#fff }
.orc-item-inp:focus { outline:none;border-color:#0ea5e9 }
/* Print: orçamento */
@media print {
  body.printing-orc > *:not(#orc-print-overlay) { display:none !important; }
  body.printing-orc #orc-print-overlay { display:block !important;position:static !important; }
  @media print { .orc-print-tip { display:none !important; } }
  #orc-print-content { font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#000 }
  #orc-print-content .orc-page { page-break-after:always }
  #orc-print-content .orc-page:last-child { page-break-after:avoid }
}
</style>
</head>
<body>
<div id="orc-wrapper">
  <div style="padding:20px 24px 64px;max-width:1100px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap">
      <img id="orc-suite-logo" src="" alt="Infraêmpério" style="height:54px;width:auto;flex-shrink:0;object-fit:contain;display:none">
      <div style="flex:1;min-width:0">
        <h2 style="font-family:'Oswald',sans-serif;font-size:1.45rem;font-weight:700;color:#1a1a2e;margin:0">Or&#xe7;amentos</h2>
        <div style="font-size:0.78rem;color:#9ca3af">Crie e gira or&#xe7;amentos profissionais para os seus clientes</div>
      </div>
      <button onclick="orcNovoAbrir()" style="background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit">+ Novo Or&#xe7;amento</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px">
      <div id="orc-stat-total" class="orc-stat-card"></div>
      <div id="orc-stat-pendente" class="orc-stat-card"></div>
      <div id="orc-stat-aprovado" class="orc-stat-card"></div>
      <div id="orc-stat-rejeitado" class="orc-stat-card"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
      <button class="orc-filter orc-filter-active" onclick="orcSetFilter('todos',this)">Todos</button>
      <button class="orc-filter" onclick="orcSetFilter('pendente',this)">Pendentes</button>
      <button class="orc-filter" onclick="orcSetFilter('aprovado',this)">Aprovados</button>
      <button class="orc-filter" onclick="orcSetFilter('rejeitado',this)">Rejeitados</button>
      <input id="orc-search" type="search" placeholder="Pesquisar..." oninput="orcRenderList()" style="margin-left:auto;border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 12px;font-size:0.84rem;font-family:inherit;color:#1a1a2e;background:#fff;min-width:180px">
    </div>
    <div id="orc-list"></div>
    <div id="orc-empty" style="display:none;text-align:center;padding:56px 16px;color:#9ca3af">
      <div style="font-size:2.5rem;margin-bottom:10px">&#x1F4C4;</div>
      <div style="font-size:0.92rem">Nenhum or&#xe7;amento. Clica em <strong>+ Novo Or&#xe7;amento</strong> para come&#xe7;ar.</div>
    </div>
  </div>
</div>

<!-- OR&#xc7;AMENTOS FORM MODAL -->
<div id="orc-form-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9100;overflow-y:auto;padding:24px 16px">
  <div style="background:#fff;max-width:800px;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.35);margin:0 auto">
    <div style="background:linear-gradient(135deg,#0369a1,#0ea5e9);padding:18px 20px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:0.7rem;color:#bae6fd;letter-spacing:0.1em;text-transform:uppercase">Or&#xe7;amentos</div>
        <div id="orc-form-titulo" style="font-family:'Oswald',sans-serif;font-size:1.3rem;font-weight:800;color:#fff">Novo Or&#xe7;amento</div>
      </div>
      <button onclick="orcFecharForm()" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1rem">&#x2715;</button>
    </div>
    <div style="padding:20px;max-height:78vh;overflow-y:auto">

      <!-- Número + Data + Cidade -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
        <div>
          <label class="orc-label">N&#xfa;mero do Or&#xe7;amento</label>
          <input id="orc-f-numero" class="orc-input" placeholder="3228">
        </div>
        <div>
          <label class="orc-label">Data</label>
          <input id="orc-f-date" class="orc-input" type="date">
        </div>
        <div>
          <label class="orc-label">Cidade</label>
          <input id="orc-f-city" class="orc-input" placeholder="Barreiro">
        </div>
      </div>

      <!-- Pesquisar cliente existente -->
      <div style="margin-bottom:14px;position:relative">
        <label class="orc-label">&#x1F50D; Pesquisar cliente existente (preenchimento automático)</label>
        <input id="orc-client-search" class="orc-input" placeholder="Nome ou telefone do cliente..." oninput="orcClientSearch(this.value)" autocomplete="off" style="background:#f0f9ff;border-color:#0ea5e9">
        <div id="orc-client-dropdown" style="display:none;position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1.5px solid #0ea5e9;border-radius:8px;max-height:220px;overflow-y:auto;z-index:500;box-shadow:0 8px 24px rgba(14,165,233,0.18)"></div>
      </div>

      <!-- Tratamento + Nome -->
      <div style="display:grid;grid-template-columns:110px 1fr;gap:12px;margin-bottom:12px">
        <div>
          <label class="orc-label">Tratamento</label>
          <select id="orc-f-salutation" class="orc-input">
            <option value="">&#x2014;</option>
            <option value="Sr.">Sr.</option>
            <option value="Sra.">Sra.</option>
          </select>
        </div>
        <div>
          <label class="orc-label">Nome do Cliente *</label>
          <input id="orc-f-clientName" class="orc-input" placeholder="Nome completo">
        </div>
      </div>

      <!-- Morada -->
      <div style="margin-bottom:12px">
        <label class="orc-label">Morada</label>
        <input id="orc-f-clientAddress" class="orc-input" placeholder="Rua da Liberdade, n&#xba;47. 2835-083 Baixa da Banheira">
      </div>

      <!-- Contacto + Email -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div>
          <label class="orc-label">Contacto (ex: Sra. Ana - 910 000 000)</label>
          <input id="orc-f-clientContact" class="orc-input" placeholder="Nome e telefone de contacto">
        </div>
        <div>
          <label class="orc-label">E-mail</label>
          <input id="orc-f-clientEmail" class="orc-input" type="email" placeholder="cliente@email.com">
        </div>
      </div>

      <!-- SERVIÇOS -->
      <div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <label class="orc-label" style="margin:0">Servi&#xe7;os</label>
          <button onclick="orcAddService()" style="background:#0ea5e9;color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit">+ Servi&#xe7;o</button>
        </div>
        <div id="orc-services-list"></div>
      </div>

      <!-- IVA mode + totals -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div>
          <label class="orc-label">Modo de IVA</label>
          <select id="orc-f-ivaMode" class="orc-input" onchange="orcCalcTotal()">
            <option value="misto">Misto — 30%@23% + 70%@6% (&#xd7;1,111)</option>
            <option value="6">Flat 6% (&#xd7;1,06) — Telhados / Fachadas</option>
            <option value="23">Flat 23% (&#xd7;1,23)</option>
          </select>
        </div>
        <div style="background:#f8fafc;border-radius:8px;padding:10px 14px;border:1.5px solid #e5e7eb">
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;color:#6b7280;margin-bottom:4px">
            <span>Material + M&#xe3;o de obra</span><span id="orc-subtotal">0,00&#x20ac;</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;color:#6b7280;margin-bottom:4px">
            <span id="orc-iva-label">IVA (misto)</span><span id="orc-iva-val">0,00&#x20ac;</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:1rem;font-weight:800;color:#1a1a2e;border-top:2px solid #1a1a2e;padding-top:6px">
            <span>TOTAL c/ IVA</span><span id="orc-total">0,00&#x20ac;</span>
          </div>
        </div>
      </div>


      <!-- ARU / Verba 2.23 -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;background:#f0fdf4;border-radius:8px;padding:10px 14px;border:1.5px solid #86efac">
        <input type="checkbox" id="orc-f-aru" style="width:18px;height:18px;accent-color:#10b981;cursor:pointer;flex-shrink:0" onchange="orcToggleAru()">
        <label for="orc-f-aru" style="font-size:0.87rem;font-weight:700;color:#065f46;cursor:pointer;line-height:1.3">Imóvel inserido em ARU — aplica IVA 6% Verba 2.23 da Lista I do CIVA</label>
      </div>
      <div id="orc-aru-local-row" style="display:none;margin-bottom:12px">
        <label class="orc-label">Localização ARU</label>
        <input id="orc-f-aruLocal" class="orc-input" placeholder="ex: na Rua Miguel Pais, nº48, no Barreiro">
      </div>
      <!-- Prazos -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div>
          <label class="orc-label">Prazo para iniciar</label>
          <input id="orc-f-prazoIniciar" class="orc-input" placeholder="10 dias &#xfa;teis ap&#xf3;s contrata&#xe7;&#xe3;o">
        </div>
        <div>
          <label class="orc-label">Prazo para t&#xe9;rmino</label>
          <input id="orc-f-prazoTermino" class="orc-input" placeholder="4 a 8 dias &#xfa;teis">
        </div>
      </div>

      <!-- Garantia + Cert Year -->
      <div style="display:grid;grid-template-columns:1fr 120px;gap:12px;margin-bottom:12px">
        <div>
          <label class="orc-label">Garantia</label>
          <input id="orc-f-warranty" class="orc-input" placeholder="3 anos de garantia para todos os servi&#xe7;os">
        </div>
        <div>
          <label class="orc-label">Ano cert. TOP</label>
          <input id="orc-f-certYear" class="orc-input" placeholder="2025">
        </div>
      </div>

      <!-- Forma de pagamento -->
      <div style="margin-bottom:12px">
        <label class="orc-label">Forma de pagamento</label>
        <select id="orc-f-payMode" class="orc-input" onchange="orcTogglePayRows()">
          <option value="50_25_25">50% adjudica&#xe7;&#xe3;o &middot; 25% conclus&#xe3;o parcial &middot; 25% final</option>
          <option value="50_50">50% adjudica&#xe7;&#xe3;o &middot; 50% conclus&#xe3;o final</option>
          <option value="100">100% na conclus&#xe3;o dos servi&#xe7;os</option>
          <option value="custom">Personalizado</option>
        </select>
        <div id="orc-pay-milestone-row" style="margin-top:6px">
          <input id="orc-f-payMilestone" class="orc-input" placeholder="Descri&#xe7;&#xe3;o da parcela interm&#xe9;dia (ex: conclus&#xe3;o da cobertura)">
        </div>
        <div id="orc-pay-custom-row" style="display:none;margin-top:6px">
          <textarea id="orc-f-payCustom" class="orc-input" style="min-height:50px;resize:vertical" placeholder="Descreva as condi&#xe7;&#xf5;es de pagamento"></textarea>
        </div>
      </div>

      <!-- Notas -->
      <div style="margin-bottom:14px">
        <label class="orc-label">Notas adicionais</label>
        <textarea id="orc-f-notes" class="orc-input" style="min-height:50px;resize:vertical" placeholder="Notas, condi&#xe7;&#xf5;es especiais..."></textarea>
      </div>


      <!-- NOTAS DA BIBLIOTECA -->
      <div style="margin-bottom:14px;border:1.5px solid #e5e7eb;border-radius:10px;overflow:hidden">
        <div style="background:#f8fafc;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="orcToggleNotasPanel()">
          <div>
            <span style="font-weight:700;font-size:0.85rem;color:#374151">📝 Notas da biblioteca</span>
            <span style="font-size:0.73rem;color:#9ca3af;margin-left:8px">lê de infraimperio_v2</span>
          </div>
          <button id="orc-notas-toggle" style="background:none;border:none;font-size:0.78rem;color:#6b7280;cursor:pointer;font-family:inherit;font-weight:700">▼ Expandir</button>
        </div>
        <div id="orc-notas-body" style="display:none;padding:12px;max-height:320px;overflow-y:auto"></div>
      </div>
      <!-- Estado -->
      <div>
        <label class="orc-label">Estado</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="orc-status-btn orc-status-pendente orc-status-active" data-status="pendente" onclick="orcSetStatus('pendente',this)">Pendente</button>
          <button class="orc-status-btn orc-status-aprovado" data-status="aprovado" onclick="orcSetStatus('aprovado',this)">Aprovado</button>
          <button class="orc-status-btn orc-status-rejeitado" data-status="rejeitado" onclick="orcSetStatus('rejeitado',this)">Rejeitado</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div style="padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;gap:8px;flex-wrap:wrap;background:#fafafa;align-items:center">
      <button onclick="orcImprimir()" style="background:#f1f5f9;color:#374151;border:1.5px solid #e5e7eb;border-radius:8px;padding:8px 14px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit">&#x1F5A8; Imprimir</button>
      <button id="orc-criar-obra-btn" onclick="orcCriarObra()" style="display:none;background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit">&#x1F3D7; Criar Obra</button>
      <button id="orc-eliminar-btn" onclick="orcEliminar()" style="display:none;background:#fee2e2;color:#dc2626;border:1.5px solid #fecaca;border-radius:8px;padding:8px 14px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit">&#x1F5D1; Eliminar</button>
      <div style="flex:1"></div>
      <button onclick="orcFecharForm()" style="background:#f1f5f9;color:#374151;border:1.5px solid #e5e7eb;border-radius:8px;padding:8px 14px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit">Cancelar</button>
      <button onclick="orcGuardar()" style="background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit">Guardar</button>
    </div>
  </div>
</div>

<!-- PRINT OVERLAY Or&#xe7;amentos -->
<div id="orc-print-overlay" style="display:none"><div id="orc-print-content"></div>
</div>

<script>
// ── Helper functions ──
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


function orcFmt(n) {
  if (isNaN(n) || n === null) return '0,00';
  return n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

// ============================================================
// ORÇAMENTOS
// ============================================================
var ORC_KEY = 'inf_orcamentos_v2';
var ORC_FILTER = 'todos';
var ORC_EDIT_ID = null;
var ORC_SERVICES = []; // [{type,name,items:[str],value:number}]
var ORC_WORK_LABELS = { telhados:'Telhados e Coberturas', claraboias:'Claraboias', canalizacao:'Canalização', carpintaria:'Carpintaria', eletricidade:'Eletricidade', estores:'Estores e Persianas', isolamento:'Isolamento', manutencao:'Manutenção', montagens:'Montagens', coluna_agua:'Coluna de Água de Prédios', obras_construcao:'Obras e Construção', pavimentos:'Pavimentos', pintura:'Pintura', piscinas:'Piscinas', reabilitacao:'Reabilitação', remodelacoes:'Remodelações', serralharia:'Serralharia', vidros:'Vidros e Janelas', pladur:'Obras em Pladur', remodelacao:'Remodelações', construcao:'Obras e Construção', instalacoes:'Instalações', outro:'Outro' };

var ORC_TEMPLATES = {
  telhados:       { iva:'6',    items:['Remoção e substituição de telhas danificadas','Impermeabilização das zonas afetadas','Reparação de cumeeiras e rufos','Limpeza pós obra na zona do serviço'] },
  claraboias:     { iva:'misto',items:['Fornecimento e montagem de claraboia','Impermeabilização do perímetro','Fixação e acabamentos','Limpeza pós obra na zona do serviço'] },
  canalizacao:    { iva:'misto',items:['Substituição da tubagem exposta','Reparação de fugas e ligações','Teste de pressão','Limpeza pós obra na zona do serviço'] },
  carpintaria:    { iva:'misto',items:['Fornecimento e montagem de material de carpintaria','Ajuste e nivelamento','Acabamentos e pintura de proteção','Limpeza pós obra na zona do serviço'] },
  eletricidade:   { iva:'23',   items:['Instalação elétrica conforme projeto','Fornecimento e montagem de material elétrico','Ligação à rede e testes','Limpeza pós obra na zona do serviço'] },
  estores:        { iva:'misto',items:['Fornecimento e montagem de estores/persianas','Regulação e testes de funcionamento','Limpeza pós obra na zona do serviço'] },
  isolamento:     { iva:'6',   items:['Fornecimento e aplicação de material isolante','Impermeabilização das zonas afetadas','Acabamentos','Limpeza pós obra na zona do serviço'] },
  manutencao:     { iva:'misto',items:['Inspeção geral das zonas afetadas','Reparação de anomalias detetadas','Limpeza e manutenção preventiva','Relatório de intervenção'] },
  montagens:      { iva:'misto',items:['Fornecimento e montagem dos equipamentos','Nivelamento e fixação','Testes de funcionamento','Limpeza pós obra na zona do serviço'] },

// ── Utility functions ────────────────────────────────────────────────────────
function orcLoad() { try { return JSON.parse(localStorage.getItem(ORC_KEY)||'[]'); } catch(e) { return []; } }
function orcSave(d) { localStorage.setItem(ORC_KEY, JSON.stringify(d)); }

function orcFmt(n) {
  var v = Math.abs(n), p = v.toFixed(2).split('.');
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1];
}

function orcDateLong(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr + 'T12:00:00');
  var months = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return d.getDate() + ' de ' + months[d.getMonth()] + ' de ' + d.getFullYear();
}

function orcMon(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr + 'T12:00:00');
  var months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return months[d.getMonth()];
}

function orcNextNum() {
  var max = 0;
  orcLoad().forEach(function(o) {
    var n = parseInt((o.numero||'').replace(/\D/g,''), 10);
    if (n > max) max = n;
  });
  return String(max + 1);
}

// Number to Portuguese words
function orcNumToWords(n) {
  var cents = Math.round((n % 1) * 100);
  var euros = Math.floor(n);
  var words = _orcIntWords(euros);
  if (cents > 0) words += ' e ' + _orcIntWords(cents) + ' cêntimos';
  return words;
}
function _orcIntWords(n) {
  if (n === 0) return 'zero';
  var units = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove'];
  var tens = ['','dez','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  var hundreds = ['','cem','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  if (n < 20) return units[n];
  if (n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' e ' + units[n%10] : '');
  if (n === 100) return 'cem';
  if (n < 1000) return hundreds[Math.floor(n/100)] + (n%100 ? ' e ' + _orcIntWords(n%100) : '');
  if (n < 2000) { var r0=n%1000; return 'mil'+(r0?(r0<100||r0%100===0?' e ':' ')+_orcIntWords(r0):''); }
  if (n < 1000000) {
    var t = Math.floor(n/1000), r = n%1000;
    return _orcIntWords(t) + ' mil' + (r ? (r<100||r%100===0?' e ':' ') + _orcIntWords(r) : '');
  }
  return n.toString();
}

function orcRenderStats() {
  var all = orcLoad();

  var rej = all.filter(function(o){ return o.status === 'rejeitado'; });
  var tot = apr.reduce(function(s,o){ return s + (o.totalComIva||o.total||0); }, 0);
  var mk = function(id,val,sub,col){ document.getElementById(id).innerHTML='<div style="font-size:0.68rem;color:#6b7280;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px">'+sub+'</div><div style="font-family:\'Oswald\',sans-serif;font-size:1.5rem;font-weight:800;color:'+col+'">'+val+'</div>'; };
  mk('orc-stat-total', all.length, 'Total', '#1a1a2e');
  mk('orc-stat-pendente', pen.length, 'Pendentes', '#d97706');

function orcRenderList() {
  var all = orcLoad();
  var srch = ((document.getElementById('orc-search')||{}).value||'').toLowerCase();
  var filtered = all.filter(function(o) {
    if (ORC_FILTER !== 'todos' && o.status !== ORC_FILTER) return false;
    if (srch) { var h = (o.clientName + o.numero + (o.workType||'')).toLowerCase(); if (!h.includes(srch)) return false; }
    return true;
  });
  filtered.sort(function(a,b){ return b.createdAt > a.createdAt ? 1 : -1; });

// ── IVA calc ─────────────────────────────────────────────────────────────────
function orcCalcTotal() {
  var sub = ORC_SERVICES.reduce(function(s,svc){ return s + (svc.value||0); }, 0);
  var mode = (document.getElementById('orc-f-ivaMode')||{}).value || 'misto';
  var multiplier = mode === '6' ? 1.06 : mode === '23' ? 1.23 : 1.111;
  var total = sub * multiplier;
  var ivaVal = total - sub;
  var ivaLbl = mode === '6' ? 'IVA 6%' : mode === '23' ? 'IVA 23%' : 'IVA (30%@23% + 70%@6%)';

  var subEl = document.getElementById('orc-subtotal');
  var ivaEl = document.getElementById('orc-iva-val');
  var ivaLblEl = document.getElementById('orc-iva-label');
  var totEl = document.getElementById('orc-total');
  if (subEl) subEl.textContent = orcFmt(sub) + '€';
  if (ivaEl) ivaEl.textContent = orcFmt(ivaVal) + '€';
  if (ivaLblEl) ivaLblEl.textContent = ivaLbl;
  if (totEl) totEl.textContent = orcFmt(total) + '€';
  return { sub:sub, ivaVal:ivaVal, total:total, mode:mode };
}

function orcClientSearch(q) {
  var dd = document.getElementById('orc-client-dropdown');
  if (!dd) return;
  if (!q || q.length < 2) { dd.style.display = 'none'; return; }
  var clients = [];
  try { clients = JSON.parse(localStorage.getItem('infraimperio_clients')||'[]'); } catch(e) {}
  var ql = q.toLowerCase();
  var matches = clients.filter(function(c) {
    return ((c.name||'')+(c.phone||'')+(c.email||'')).toLowerCase().includes(ql);
  }).slice(0,8);
  if (!matches.length) { dd.innerHTML='<div style="padding:10px 14px;font-size:0.83rem;color:#9ca3af">Nenhum cliente encontrado.</div>'; dd.style.display='block'; return; }
  dd.innerHTML = matches.map(function(c) {
    var sal = c.salutation ? c.salutation+' ' : '';
    var city = (c.address&&c.address.city) ? ' · '+escHtml(c.address.city) : '';
    return '<div onclick="orcSelectClient('+escHtml(JSON.stringify(c))+')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background 0.1s" onmouseover="this.style.background=\'#f0f9ff\'" onmouseout="this.style.background=\'\'">' +
      '<div style="font-weight:700;font-size:0.88rem;color:#1a1a2e">'+escHtml(sal+c.name)+'</div>' +
      '<div style="font-size:0.75rem;color:#6b7280;margin-top:1px">'+escHtml(c.phone||'—')+city+'</div>' +
    '</div>';
  }).join('');
  dd.style.display = 'block';
}

function orcClientSearchClose() {
  var dd = document.getElementById('orc-client-dropdown');
  if (dd) dd.style.display = 'none';
}

function orcSelectClient(cJson) {
  var c;
  try { c = (typeof cJson === 'string') ? JSON.parse(cJson) : cJson; } catch(e) { return; }
  // Fill salutation + name
  document.getElementById('orc-f-salutation').value = c.salutation||'';
  document.getElementById('orc-f-clientName').value = c.name||'';
  // Build address string: Rua, Nº, Andar, Cidade — Código Postal
  var addr = '';
  if (c.address) {
    var a = c.address;
    var parts = [];
    if (a.street) parts.push(a.street);
    if (a.number) parts.push('nº'+a.number);
    if (a.floor)  parts.push(a.floor);
    if (a.city)   parts.push(a.city);
    if (a.postalCode) parts.push(a.postalCode);
    addr = parts.join(', ');
  }
  document.getElementById('orc-f-clientAddress').value = addr;
  // Contact: "Sra. Ana - 910 000 000"
  var sal = c.salutation ? c.salutation+' ' : '';
  document.getElementById('orc-f-clientContact').value = sal+(c.name||'')+(c.phone?' - '+c.phone:'');
  document.getElementById('orc-f-clientEmail').value = c.email||'';
  // Clear search
  var si = document.getElementById('orc-client-search');
  if (si) si.value = '';
  orcClientSearchClose();
  premToast('✅ Cliente preenchido: '+(c.name||''));
}

function orcRenderNotasPanel() {
  var panel = document.getElementById('orc-notas-body');
  if (!panel) return;
  var db = null;
  try { db = JSON.parse(localStorage.getItem('infraimperio_v2') || 'null'); } catch(e) {}
  if (!db || !db.notas || !db.notas.length) {
    panel.innerHTML = '<div style="padding:12px;font-size:0.82rem;color:#9ca3af;text-align:center"><em>Sem notas. Abra Orcamentos-Infraimperio.html primeiro para carregar a biblioteca.</em></div>';
    return;
  }
  function mkItems(list, type) {
    return list.sort(function(a,b){return (b.n||0)-(a.n||0);}).map(function(n) {
      var sel = type === 'cb' ? ORC_NT_SEL.includes(n.id) : (type === 'imp' ? ORC_NT_IMP === n.id : ORC_NT_CON === n.id);
      var onch = type === 'cb'
        ? "orcNtSelToggle('" + n.id + "')"
        : (type === 'imp' ? "ORC_NT_IMP='" + n.id + "'" : "ORC_NT_CON='" + n.id + "'");
      return '<label style="display:flex;align-items:flex-start;gap:8px;padding:5px 6px;cursor:pointer;border-radius:6px" ' +
        'onmouseover="this.style.background=\'#f0f9ff\'" onmouseout="this.style.background=\'\'">' +
        '<input type="' + (type === 'cb' ? 'checkbox' : 'radio') + '" ' + (sel ? 'checked' : '') + ' onchange="' + onch + '" ' +
        'style="margin-top:3px;accent-color:#7c3aed;flex-shrink:0">' +
        '<div>' +
          '<div style="font-size:0.77rem;font-weight:700;color:#374151">' + escHtml(n.rot || n.gl || '') + '</div>' +
          '<div style="font-size:0.71rem;color:#9ca3af">' + escHtml(((n.lab || n.txt) || '').slice(0,100)) + (((n.lab || n.txt) || '').length > 100 ? '…' : '') + '</div>' +
        '</div>' +
      '</label>';
    }).join('');
  }
  var notas    = db.notas;
  var corpo    = notas.filter(function(n){ return n.pos === 'corpo'; });
  var garantia = notas.filter(function(n){ return n.pos === 'garantia'; });
  var imp      = notas.filter(function(n){ return n.pos === 'final' && (n.g === 'importante' || n.g === 'especial'); });
  var con      = notas.filter(function(n){ return n.pos === 'final' && n.g !== 'importante' && n.g !== 'especial'; });
  var html = '';
  if (corpo.length)    html += '<div style="margin-bottom:10px"><div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:#7c3aed;margin-bottom:4px">Notas do corpo — pág. 1</div>' + mkItems(corpo, 'cb') + '</div>';
  if (garantia.length) html += '<div style="margin-bottom:10px"><div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:#7c3aed;margin-bottom:4px">Notas da garantia — pág. 2</div>' + mkItems(garantia, 'cb') + '</div>';
  if (imp.length)      html += '<div style="margin-bottom:10px"><div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:#d97706;margin-bottom:4px">Nota importante — pág. 2</div>' + mkItems(imp, 'imp') + '</div>';
  if (con.length)      html += '<div style="margin-bottom:10px"><div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:#0ea5e9;margin-bottom:4px">Nota de contacto — pág. 2</div>' + mkItems(con, 'con') + '</div>';
  panel.innerHTML = html || '<div style="padding:12px;text-align:center;font-size:0.82rem;color:#9ca3af">Sem notas disponíveis.</div>';
}


// ── Biblioteca de serviços (infraimperio_v2) ─────────────────────────────────
var ORC_LIB_MATCHES = {};

function orcGetLib() {
  try { var db=JSON.parse(localStorage.getItem('infraimperio_v2')||'null'); return (db&&Array.isArray(db.lib))?db.lib:[]; } catch(e){return [];}
}

function orcLibSearch(si, q) {
  var dd = document.getElementById('orc-lib-dd-'+si);
  if (!dd) return;
  if (!q || q.length < 2) { dd.style.display='none'; return; }
  var lib = orcGetLib();
  if (!lib.length) {
    dd.innerHTML='<div style="padding:10px 14px;font-size:0.82rem;color:#9ca3af;text-align:center">Biblioteca não encontrada. Abra a app Orcamentos-Infraimperio.html primeiro para carregar os serviços.</div>';
    dd.style.display='block'; return;
  }
  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  var ql = norm(q);
  var matches = lib.filter(function(s){ return norm(s.nome).includes(ql)||norm(s.cat||'').includes(ql); })
    .sort(function(a,b){ return (b.freq||0)-(a.freq||0); }).slice(0,14);
  ORC_LIB_MATCHES[si] = matches;
  if (!matches.length) { dd.style.display='none'; return; }
  dd.innerHTML = matches.map(function(s,i){
    return '<div style="padding:9px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:0.83rem" ' +
      'onmousedown="orcLibApply('+si+','+i+')" ' +
      'onmouseover="this.style.background=\'#f5f3ff\'" onmouseout="this.style.background=\'\'">'+
      '<div style="font-weight:700;color:#1a1a2e">'+escHtml(s.nome||'')+'</div>'+
      '<div style="font-size:0.73rem;color:#7c3aed">'+escHtml(s.cat||'')+'</div>'+
    '</div>';
  }).join('');
  dd.style.display='block';
}

function orcLibApply(si, i) {
  var matches=ORC_LIB_MATCHES[si];
  if (!matches||!matches[i]) return;
  var s=matches[i];
  ORC_SERVICES[si].name=s.nome||'';
  ORC_SERVICES[si].items=(s.tarefas||[]).slice();
  orcRenderServices(); orcCalcTotal();
  var wEl=document.getElementById('orc-f-warranty');
  if (wEl && !wEl.value && s.garantia) wEl.value=s.garantia;
  var pEl=document.getElementById('orc-f-prazoTermino');
  if (pEl && !pEl.value && s.prazo) pEl.value=s.prazo;
}
